<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanban Firebase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Kanban Board</h1>

  <!-- BOARD -->
  <div id="board">
    <div class="column" id="todo">
      <h2>To Do</h2>
      <input id="todoInput" placeholder="New task">
      <button onclick="addTask('todo')">Add</button>
      <div class="task-list" id="todoList"></div>
    </div>

    <div class="column" id="inprogress">
      <h2>In Progress</h2>
      <div class="task-list" id="inprogressList"></div>
    </div>

    <div class="column" id="done">
      <h2>Done</h2>
      <div class="task-list" id="doneList"></div>
    </div>
  </div>

<script type="module" src="app.js"></script>
</body>
</html>
