<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kanban Firebase</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>🚀 Kanban Task Manager</h1>
  <div id="userInfo" style="display:none;">
  <span id="welcomeText"></span>
  </div>

  <!-- LOGIN -->
  <div id="auth">
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password">

    <button id="registerBtn" onclick="register()">Register</button>
    <button id="loginBtn" onclick="login()">Login</button>
    <button id="logoutBtn" onclick="logout()" style="display:none;">Logout</button>
  </div>

  <!-- BOARD -->
  <div id="board" style="display:none;">
    
    <div class="column" id="todo">
      <h2>To Do</h2>
      <input id="todoInput" placeholder="New task">
      <button onclick="addTask('todo')">Add</button>
      <div class="task-list" id="todoList"></div>
    </div>

    <div class="column" id="inprogress">
      <h2>In Progress</h2>
      <div class="task-list" id="inprogressList"></div>
    </div>

    <div class="column" id="done">
      <h2>Done</h2>
      <div class="task-list" id="doneList"></div>
    </div>

  </div>

  <!-- SCRIPT -->
  <script type="module" src="app.js"></script>

</body>
</html>
